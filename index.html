    <!-- Clarity deferred to after page load -->
    <script>
      window.addEventListener('load', function() {

        }, 3000);
      });
    </script>

    <!-- Monetag In-Page Push (zone 10975652) — deferred until idle after load
         so it never blocks LCP on mobile. -->
    <script>
      window.addEventListener('load', function () {
        var run = function () {
          try {
            var s = document.createElement('script');
            s.dataset.zone = '10975652';
            s.src = 'https://nap5k.com/tag.min.js';
            s.async = true;
            (document.body || document.documentElement).appendChild(s);
          } catch (e) { /* noop */ }
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(run, { timeout: 5000 });
        } else {
          setTimeout(run, 4000);
        }
      });
    </script>
